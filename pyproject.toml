[project]
name = "metacog"
version = "0.1.0"
description = "Metacognition for coding agents: catch false claims, suspicious actions and waste in Claude Code, Muse Code and Codex sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
metacog = "metacog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metacog"]

[dependency-groups]
dev = ["pytest"]
