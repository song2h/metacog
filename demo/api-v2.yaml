apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: metacog-demo/api:v2
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
